[project]
name = "insurance-claims-agent"
version = "0.1.0"
description = "Fictional insurance claim intake agent with LangGraph and local LM Studio"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "openai>=3.46.0",
    "pydantic>=2.14.3",
]

[project.scripts]
claims-agent = "insurance_claims_agent.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
